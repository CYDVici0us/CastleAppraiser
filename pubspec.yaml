name: btcc
description: Flutter app to score castles for the game Between Two Castles

publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.5.0

flutter_launcher_icons:
  image_path: 'assets/images/logo.png'
  android: true
  ios: true

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.11.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  json_annotation: ^4.9.0
  image: ^4.5.3
  exif: ^3.3.0
  file_picker: ^8.1.7
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  auto_size_text: ^3.0.0
  firebase_core: ^3.12.1
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  url_launcher: ^6.3.1
  flutter_email_sender: ^6.0.3
  camera: ^0.11.1
  flutter_hooks: ^0.20.5
  screenshot: ^3.0.0
  gal: ^2.3.1
  share_plus: ^12.0.2

dev_dependencies:
  test: ^1.25.8
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_ce_generator: ^1.8.1
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
